<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>วงนี้มีเกม - Premium Party Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div><div class="bg-orb orb-3"></div>
<div id="flash-overlay"></div>

<div id="app-container">
    
    <div id="home-view" class="dashboard-layout">
        
        <div class="header-section text-center mb-3 mt-3">
            <h1 class="text-gradient pulse-text" style="font-size: 2.2rem; margin-bottom: 5px;">วงนี้มีเกม 🎮</h1>
            <p class="text-muted" style="font-size: 0.9rem;">Premium Party Hub</p>
        </div>

        <div class="toolbar-section mb-3">
            <button onclick="toggleCampfire()" id="btn-campfire" class="action-btn toolbar-btn">🏕️ โหมดแคมป์</button>
            <button onclick="shareApp()" class="action-btn toolbar-btn btn-neon-blue">🔗 ชวนเพื่อน</button>
            <button onclick="splitTeams()" class="action-btn toolbar-btn btn-neon-pink">🤝 แบ่งทีม</button>
            <button onclick="showPenaltyModal()" class="action-btn toolbar-btn btn-danger">💀 สุ่มทำโทษ</button>
        </div>

        <div class="dashboard-grid">
            <div class="player-panel glass-card p-3 mb-3">
                <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="togglePlayerList()">
                    <h4 class="text-gradient m-0">👥 ผู้เล่น & HP (<span id="player-count">0</span>)</h4>
                    <span id="player-toggle-icon">▼</span>
                </div>
                
                <div id="player-manage-section" class="mt-3">
                    <div class="add-player-box mb-2">
                        <input type="text" id="new-player-name" placeholder="ใส่ชื่อเพื่อน..." autocomplete="off">
                        <button onclick="addPlayer()" class="btn-neon-blue" style="width: 70px; padding: 10px;">เพิ่ม</button>
                    </div>
                    <div id="player-list" class="player-list-container"></div>
                </div>
            </div>

            <div class="game-panel glass-card p-3">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 class="text-gradient" style="margin: 0;">🎮 เลือกเกม</h3>
                    <button onclick="randomGameSelect()" class="btn-neon-purple" style="width: auto; padding: 5px 15px; font-size: 0.8rem;">🎲 สุ่มเกม</button>
                </div>
                <div class="mb-3" style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 12px;">
                    <span style="font-size: 0.8rem;">🔊 เสียงคลอ:</span>
                    <select id="ambience-select" onchange="changeAmbience()" style="padding: 5px; border-radius: 8px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--neon-blue); font-size: 0.8rem;">
                        <option value="none">ปิดเสียง</option>
                        <option value="crickets">🏕️ เสียงจิ้งหรีด</option>
                        <option value="heartbeat">💓 ลุ้นระทึก</option>
                    </select>
                </div>
                <div class="game-grid" id="game-grid"></div>
                
                <button onclick="endParty()" class="btn-danger action-btn mt-4" style="width: 100%;">🛑 จบปาร์ตี้ สรุปผลซอมบี้</button>
            </div>
        </div>
    </div>

    <div id="game-view" class="hidden glass-overlay">
        <div class="game-header-container" style="position: sticky; top: 0; z-index: 11; background: rgba(0,0,0,0.8); border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div class="game-header" style="display: flex; align-items: center; padding: 15px;">
                <button class="back-btn" onclick="closeGame()" style="width:auto; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-right:15px;">◀ กลับ</button>
                <h3 id="game-title" class="text-gradient" style="flex: 1; text-align: left; margin:0; font-size: 1.2rem;">Game</h3>
            </div>
            <div id="mini-hp-bar" class="mini-hp-bar"></div>
        </div>
        <div class="game-content" id="game-content"></div>
    </div>

    <div id="summary-view" class="hidden p-4 glass-overlay">
        <h1 class="text-gradient mb-4 mt-4 pulse-text text-center">🎉 สรุปผลปาร์ตี้ 🎉</h1>
        <div id="summary-content" class="glass-card mb-4 p-4"></div>
        <button onclick="copySummary()" class="btn-neon-blue mb-3 action-btn">📋 คัดลอกผลสรุป</button>
        <button onclick="resetAll()" class="btn-danger action-btn">🔄 เริ่มงานใหม่ทั้งหมด</button>
    </div>

    <div id="penalty-modal" class="hidden modal-overlay"><div class="glass-card p-4 text-center modal-box"><h2 class="mb-4 text-gradient">💀 บทลงโทษ</h2><div id="penalty-result" class="timer-text mb-4" style="font-size: 1.5rem; color: #ef4444; line-height: 1.4;">กดสุ่มเลย!</div><button class="btn-danger action-btn mb-2" onclick="rollPenalty()">🎲 สุ่มลงโทษ</button><button class="btn-neon-purple action-btn" onclick="closeModals()">ปิดหน้าต่าง</button></div></div>
    <div id="team-modal" class="hidden modal-overlay"><div class="glass-card p-4 modal-box text-center"><h2 class="mb-4 text-gradient">🤝 ผลการแบ่งทีม</h2><div id="team-result" style="text-align: left; margin-bottom: 20px;"></div><button class="btn-neon-blue action-btn mb-2" onclick="splitTeams()">🔄 สุ่มใหม่</button><button class="btn-danger action-btn" onclick="closeModals()">ปิดหน้าต่าง</button></div></div>
    <div id="toast-container"></div>
</div>
<script src="script.js"></script>
</body>
</html>
