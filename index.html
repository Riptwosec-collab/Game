<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>วงนี้มีเกม - Premium Party Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>
<div id="flash-overlay"></div>

<div id="app-container">
    
    <div id="home-view" class="dashboard-layout">
        
        <div class="header-section text-center mb-4">
            <h1 class="text-gradient pulse-text" style="font-size: 2.5rem; margin-bottom: 5px;">วงนี้มีเกม 🎮</h1>
            <p class="text-muted">Premium Party Hub</p>
        </div>

        <div class="toolbar-section mb-4">
            <button onclick="toggleCampfire()" id="btn-campfire" class="action-btn toolbar-btn">🏕️ โหมดแคมป์</button>
            <button onclick="shareApp()" class="action-btn toolbar-btn btn-neon-blue">🔗 ชวนเพื่อน</button>
            <button onclick="splitTeams()" class="action-btn toolbar-btn btn-neon-pink">🤝 แบ่งทีม</button>
            <button onclick="showPenaltyModal()" class="action-btn toolbar-btn btn-danger">💀 สุ่มทำโทษ</button>
        </div>

        <div class="dashboard-grid">
            
            <div class="player-panel glass-card p-4">
                <h3 class="mb-3 text-gradient">👥 รายชื่อผู้เล่น & HP</h3>
                <div class="add-player-box mb-3">
                    <input type="text" id="new-player-name" placeholder="ใส่ชื่อเพื่อน..." autocomplete="off">
                    <button onclick="addPlayer()" class="btn-neon-blue">เพิ่ม</button>
                </div>
                <div id="player-list" class="player-list-container"></div>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button onclick="endParty()" class="btn-danger action-btn" style="flex: 1;">🛑 จบปาร์ตี้</button>
                </div>
            </div>

            <div class="game-panel glass-card p-4">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 class="text-gradient" style="margin: 0;">🎮 เลือกเกม</h3>
                    <button onclick="randomGameSelect()" class="btn-neon-purple" style="width: auto; padding: 5px 15px; font-size: 0.9rem;">🎲 สุ่มเกม</button>
                </div>
                <div class="mb-3" style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 12px;">
                    <span style="font-size: 0.9rem;">🔊 เสียงคลอ:</span>
                    <select id="ambience-select" onchange="changeAmbience()" style="padding: 5px; border-radius: 8px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--neon-blue);">
                        <option value="none">ปิดเสียง</option>
                        <option value="crickets">🏕️ เสียงจิ้งหรีด</option>
                        <option value="heartbeat">💓 ลุ้นระทึก</option>
                    </select>
                </div>
                <div class="game-grid" id="game-grid"></div>
            </div>

        </div>
    </div>

    <div id="game-view" class="hidden glass-overlay">
        <div class="game-header">
            <button class="back-btn" onclick="closeGame()">◀ กลับ</button>
            <h2 id="game-title" class="text-gradient" style="flex: 1; text-align: left;">Game Title</h2>
        </div>
        <div class="game-content" id="game-content"></div>
    </div>

    <div id="summary-view" class="hidden p-4 glass-overlay">
        <h1 class="text-gradient mb-4 mt-4 pulse-text text-center">🎉 สรุปผลปาร์ตี้ 🎉</h1>
        <div id="summary-content" class="glass-card mb-4 p-4"></div>
        <button onclick="copySummary()" class="btn-neon-blue mb-3 action-btn">📋 คัดลอกผลสรุป</button>
        <button onclick="resetAll()" class="btn-danger action-btn">🔄 เริ่มงานใหม่ทั้งหมด</button>
    </div>

    <div id="penalty-modal" class="hidden modal-overlay">
        <div class="glass-card p-4 text-center modal-box">
            <h2 class="mb-4 text-gradient">💀 บทลงโทษ</h2>
            <div id="penalty-result" class="timer-text mb-4" style="font-size: 1.5rem; color: #ef4444; line-height: 1.4;">กดสุ่มเลย!</div>
            <button class="btn-danger action-btn mb-2" onclick="rollPenalty()">🎲 สุ่มลงโทษ</button>
            <button class="btn-neon-purple action-btn" onclick="closeModals()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="team-modal" class="hidden modal-overlay">
        <div class="glass-card p-4 modal-box text-center">
            <h2 class="mb-4 text-gradient">🤝 ผลการแบ่งทีม</h2>
            <div id="team-result" style="text-align: left; margin-bottom: 20px;"></div>
            <button class="btn-neon-blue action-btn mb-2" onclick="splitTeams()">🔄 สุ่มใหม่</button>
            <button class="btn-danger action-btn" onclick="closeModals()">ปิดหน้าต่าง</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
