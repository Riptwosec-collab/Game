<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>วงนี้มีเกม - Party Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
    
    <div id="home-view" class="p-4">
        <div class="header mb-4">
            <h1 class="text-gradient">วงนี้มีเกม 🎮</h1>
            <p class="text-muted">รวม 10 เกมปาร์ตี้ เล่นได้ในเว็บเดียว</p>
        </div>

        <div class="mb-4">
            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <input type="text" id="new-player-name" placeholder="ใส่ชื่อผู้เล่น..." autocomplete="off">
                <button onclick="addPlayer()" class="btn-neon-blue" style="width: 80px;">เพิ่ม</button>
            </div>
            <div id="player-list"></div>
        </div>

        <hr style="border-color: #2d2d3a; margin: 20px 0;">

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button onclick="randomGameSelect()" class="btn-neon-purple">🎲 สุ่มเกม</button>
            <button onclick="endParty()" class="btn-danger">🛑 จบปาร์ตี้</button>
        </div>

        <h3 class="mb-2 text-gradient">เลือกเกม</h3>
        <div class="game-grid" id="game-grid">
            </div>
    </div>

    <div id="game-view" class="hidden">
        <div class="game-header">
            <button class="back-btn" onclick="closeGame()">◀ กลับ</button>
            <h2 id="game-title" class="text-gradient" style="flex: 1; text-align: left;">Game Title</h2>
        </div>
        <div class="game-content" id="game-content">
            </div>
        <div style="padding: 10px; background: var(--card-dark); border-top: 1px solid #2d2d3a; max-height: 150px; overflow-y: auto;" id="quick-score-panel">
            <h4 style="text-align: center; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem;">ให้คะแนนด่วน</h4>
            <div id="quick-score-list" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;"></div>
        </div>
    </div>

    <div id="summary-view" class="hidden p-4">
        <h1 class="text-gradient mb-4 mt-4">🎉 สรุปผลปาร์ตี้ 🎉</h1>
        <div id="summary-content" style="background: var(--card-dark); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--neon-pink);">
        </div>
        <button onclick="copySummary()" class="btn-neon-blue mb-2">📋 คัดลอกผลสรุป</button>
        <button onclick="resetAll()" class="btn-danger">🔄 ล้างข้อมูลทั้งหมด (เริ่มใหม่)</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
